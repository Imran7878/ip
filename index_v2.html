  <script>
    (() => {
      const historyKey = "subnetx_history";
      const historyLimit = 5;
      const nativeFetch = window.fetch.bind(window);
      const actionName = operation => ["records", operation].join(".");

      function readHistory() {
        const stored = window.localStorage.getItem(historyKey);
        if (stored === null) return [];
        const records = JSON.parse(stored);
        if (!Array.isArray(records)) throw new Error("Saved history data is invalid.");
        const recentRecords = records.slice(-historyLimit);
        if (recentRecords.length !== records.length) {
          window.localStorage.setItem(historyKey, JSON.stringify(recentRecords));
        }
        return recentRecords;
      }

      function respond(data) {
        return new Response(JSON.stringify({data}), {
          headers: {"content-type": "application/json"},
          status: 200,
        });
      }

      window.fetch = async (input, init) => {
        const isRequest = input instanceof Request;
        const method = init?.method ?? (isRequest ? input.method : "GET");
        const url = new URL(isRequest ? input.url : String(input), window.location.href);
        if (String(method).toUpperCase() !== "POST" || !url.pathname.endsWith("/actions")) {
          return nativeFetch(input, init);
        }

        let body = init?.body;
        if (body == null && isRequest) body = await input.clone().text();
        if (typeof body !== "string") return nativeFetch(input, init);

        let payload;
        try {
          payload = JSON.parse(body);
        } catch {
          return nativeFetch(input, init);
        }
        if (payload?.args?.collection !== historyKey) return nativeFetch(input, init);

        const args = payload.args;
        if (payload.action === actionName("list")) {
          return respond({records: readHistory()});
        }
        if (payload.action === actionName("create")) {
          const records = readHistory();
          const id = `${Date.now()}-${Math.random().toString(36).slice(2)}`;
          records.push({id, value: args.value});
          window.localStorage.setItem(historyKey, JSON.stringify(records.slice(-historyLimit)));
          return respond({id});
        }
        if (payload.action === actionName("delete")) {
          const records = readHistory().filter(record => record.id !== args.id);
          window.localStorage.setItem(historyKey, JSON.stringify(records));
          return respond(true);
        }
        return nativeFetch(input, init);
      };

      function observeHistoryLimitLabel() {
        const root = document.getElementById("root");
        if (!root) return;
        const updateHistoryLimitLabel = () => {
          const section = root.querySelector('[aria-label="History"]');
          if (!section) return;
          const walker = document.createTreeWalker(section, NodeFilter.SHOW_TEXT);
          let textNode;
          while ((textNode = walker.nextNode())) {
            const updatedText = textNode.nodeValue
              .replace(/\/8$/, "/5")
              .replace("last 8 calculations", "last 5 calculations");
            if (updatedText !== textNode.nodeValue) textNode.nodeValue = updatedText;
          }
        };
        new MutationObserver(updateHistoryLimitLabel).observe(root, {
          childList: true,
          characterData: true,
          subtree: true,
        });
        updateHistoryLimitLabel();
      }

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", observeHistoryLimitLabel, {once: true});
      } else {
        observeHistoryLimitLabel();
      }
    })();
